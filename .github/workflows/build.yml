name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"
      - name: Unzip e corrigir settings
        run: |
          unzip -o ninjaclient.zip
          cat > ninjaclient/settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              maven { url = 'https://maven.fabricmc.net/' }
              gradlePluginPortal()
              mavenCentral()
            }
          }
          rootProject.name = 'ninjaclient'
          EOF
      - run: cd ninjaclient && gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: ninjaclient
          path: ninjaclient/build/libs/*.jar
